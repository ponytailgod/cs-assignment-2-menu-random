<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deadline Radar</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <section class="hero">
      <p class="badge">Assignment Risk Calculator</p>
      <h1>Deadline Radar</h1>
      <p class="subtitle">
        과제의 마감일, 남은 작업량, 난이도를 바탕으로 마감 위험도를 계산해주는 웹앱입니다.
      </p>
    </section>

    <section class="container">
      <form id="taskForm" class="card form-card">
        <h2>과제 정보 입력</h2>

        <label>
          과제명
          <input type="text" id="taskName" placeholder="예: 컴퓨터 개론 과제 2" required />
        </label>

        <label>
          마감일
          <input type="date" id="deadline" required />
        </label>

        <label>
          예상 총 소요 시간
          <input type="number" id="totalHours" min="0.5" step="0.5" placeholder="예: 10" required />
        </label>

        <label>
          현재 진행률 (%)
          <input type="number" id="progress" min="0" max="100" placeholder="예: 30" required />
        </label>

        <label>
          난이도
          <select id="difficulty">
            <option value="0.9">쉬움</option>
            <option value="1" selected>보통</option>
            <option value="1.2">어려움</option>
          </select>
        </label>

        <label>
          하루 투자 가능 시간
          <input type="number" id="dailyHours" min="0.5" step="0.5" placeholder="예: 2" required />
        </label>

        <button type="submit">위험도 계산하기</button>
      </form>

      <section id="resultCard" class="card result-card hidden">
        <p id="riskLabel" class="risk-label">결과</p>
        <h2 id="resultTitle">과제명</h2>

        <div class="result-grid">
          <div>
            <span>남은 작업 시간</span>
            <strong id="remainingHours">0시간</strong>
          </div>
          <div>
            <span>마감까지</span>
            <strong id="daysLeft">0일</strong>
          </div>
          <div>
            <span>위험도 점수</span>
            <strong id="riskScore">0.00</strong>
          </div>
          <div>
            <span>오늘 최소 작업량</span>
            <strong id="todayWork">0시간</strong>
          </div>
        </div>

        <p id="advice" class="advice">추천 행동이 여기에 표시됩니다.</p>
      </section>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
